name: REGISTRY - Build Nextcloud image with extra packages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      dev_tag:
        description: 'Latest released tag to be used in DEV (Interger only)'
        # Default value if no value is explicitly provided
        default: 33
        # Input has to be provided for the workflow to run
        required: true
        # The data type of the input
        type: number
      prod_tag:
        description: 'Production Tag (Interger only)'
        # Default value if no value is explicitly provided
        default: 32
        # Input has to be provided for the workflow to run
        required: true
        # The data type of the input
        type: number

jobs:
  dev-docker:
    runs-on: oci-br  # ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # FIX 1: Configure BuildKit options directly on the setup action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.19.3 # Pinned to a reliable Buildx version
          driver-opts: |
            image=moby/buildkit:v0.19.0
          # FIX 2: Restrict parallelism to stop OOM crashes during ffmpeg/imagemagick builds
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Login to REGISTRY Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Clean up Docker system resources
        run: |
          echo "=== Before cleanup ==="
          docker system df
          echo "=== Running prune ==="
          docker system prune -af --volumes
          echo "=== After cleanup ==="
          docker system df

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          file: ./dev/Dockerfile
          build-args: BASE_IMAGE=nextcloud:${{ inputs.dev_tag }}-apache
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USER }}/nextcloud-imagemagick-ffmpeg:current
            ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USER }}/nextcloud-imagemagick-ffmpeg:dev
            ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USER }}/nextcloud-imagemagick-ffmpeg:nc-${{ inputs.dev_tag }}-apache
          labels: |
            org.opencontainers.image.title=nextcloud-imagemagick-ffmpeg
            org.opencontainers.image.description=Build Nextcloud Current image with imagemagick and ffmpeg packages for ARM and x86 systems
   

